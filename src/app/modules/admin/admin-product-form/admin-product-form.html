<div class="admin-page">
  <div class="admin-header">
    <div>
      <a routerLink="/admin/products" class="back-link">
        <i class="bi bi-arrow-left"></i> {{ t('admin.backToList') }}
      </a>
      <h1>{{ isEditMode() ? t('admin.editProduct') : t('admin.addProduct') }}</h1>
    </div>
  </div>

  @if (loading()) {
    <div class="admin-loading">
      <span class="spinner"></span>
      {{ t('common.loading') }}
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="product-form">
      @if (errorMessage()) {
        <div class="alert-error">{{ errorMessage() }}</div>
      }

      <div class="form-grid">
        <div class="form-group full-width">
          <label>{{ t('admin.fieldName') }}</label>
          <input type="text" formControlName="name" [class.invalid]="form.get('name')?.invalid && form.get('name')?.touched">
        </div>

        <div class="form-group">
          <label>{{ t('admin.fieldCategory') }}</label>
          <select formControlName="category" (change)="onCategoryChange()">
            @for (cat of categoryOptions; track cat.key) {
              <option [value]="cat.key">{{ cat.label }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label>{{ t('admin.fieldSubCategory') }}</label>
          <select formControlName="subCategory" [class.invalid]="form.get('subCategory')?.invalid && form.get('subCategory')?.touched">
            <option value="" disabled>{{ t('admin.selectSubCategory') }}</option>
            @for (sub of getSubCategoriesFor(form.get('category')?.value); track sub) {
              <option [value]="sub">{{ sub }}</option>
            }
          </select>
        </div>

        <div class="form-group">
          <label>{{ t('admin.fieldPrice') }}</label>
          <input type="number" step="0.01" formControlName="price" [class.invalid]="form.get('price')?.invalid && form.get('price')?.touched">
        </div>

        <div class="form-group full-width">
          <label>{{ t('admin.fieldImage') }}</label>
          <input type="text" formControlName="image" placeholder="https://..." [class.invalid]="form.get('image')?.invalid && form.get('image')?.touched">
        </div>

        <div class="form-group full-width">
          <label>{{ t('admin.fieldDesc') }}</label>
          <input type="text" formControlName="desc" [class.invalid]="form.get('desc')?.invalid && form.get('desc')?.touched">
        </div>

        <div class="form-group full-width">
          <label>{{ t('admin.fieldDescription') }}</label>
          <textarea formControlName="description" rows="4"></textarea>
        </div>

        <div class="form-group full-width">
          <label>{{ t('admin.fieldFeatures') }}</label>
          <textarea formControlName="features" rows="5" [placeholder]="t('admin.featuresPlaceholder')"></textarea>
        </div>

        <div class="form-group full-width">
          <label>{{ t('admin.fieldDescAr') }}</label>
          <input type="text" formControlName="descAr" dir="rtl">
        </div>

        <div class="form-group full-width">
          <label>{{ t('admin.fieldDescriptionAr') }}</label>
          <textarea formControlName="descriptionAr" rows="4" dir="rtl"></textarea>
        </div>

        <div class="form-group full-width">
          <label>{{ t('admin.fieldFeaturesAr') }}</label>
          <textarea formControlName="featuresAr" rows="5" dir="rtl" [placeholder]="t('admin.featuresPlaceholder')"></textarea>
        </div>

        <div class="form-group">
          <label>{{ t('admin.fieldBrand') }}</label>
          <input type="text" formControlName="brand" [placeholder]="t('admin.brandPlaceholder')">
        </div>

        <div class="form-group">
          <label>{{ t('admin.fieldStock') }}</label>
          <input type="number" formControlName="stock" min="0">
        </div>

        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="onSale">
            {{ t('admin.fieldOnSale') }}
          </label>
        </div>

        @if (form.get('onSale')?.value) {
          <div class="form-group">
            <label>{{ t('admin.fieldSalePrice') }}</label>
            <input type="number" step="0.01" formControlName="salePrice">
          </div>

          <div class="form-group">
            <label>{{ t('admin.fieldDiscount') }}</label>
            <input type="number" formControlName="discount">
          </div>
        }
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-primary" [disabled]="saving()">
          @if (saving()) {
            <span class="spinner small"></span>
            {{ t('admin.saving') }}
          } @else {
            <i class="bi bi-check-lg"></i>
            {{ t('admin.save') }}
          }
        </button>
        <a routerLink="/admin/products" class="btn-secondary">{{ t('admin.cancel') }}</a>
      </div>
    </form>
  }
</div>
